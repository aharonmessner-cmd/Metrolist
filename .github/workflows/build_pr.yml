name: Build PR

on:
  pull_request:
    branches:
      - "**"
    # Weblate PRs only touch localized string files, which cannot break a
    # build that the base branch already compiles. The default (unsuffixed)
    # `values/` directory is deliberately not listed, so English string
    # changes still build.
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"
  # Lets this exact workflow be run manually against any branch (no PR
  # required), e.g. to verify a change before opening a PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No secrets here - just tool/runtime versions, to make a failure further down
      # diagnosable from the log alone without re-running anything.
      - name: Print build environment info
        run: |
          echo "== java -version =="
          java -version
          echo "== ./gradlew --version =="
          ./gradlew --version
          echo "== uname -a =="
          uname -a
          echo "== Project Kotlin/AGP versions (gradle/libs.versions.toml) =="
          grep -E '^(kotlin|agp)\s*=' gradle/libs.versions.toml || true

      - name: Restore PR debug keystore
        id: pr_keystore
        uses: actions/cache/restore@v5
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-${{ github.event.number || 'manual' }}

      - name: Generate PR debug keystore if not cached
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist PR ${{ github.event.number || 'manual' }},O=Metrolist,C=US"

      - name: Save PR debug keystore
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: app/pr-debug.keystore
          key: ${{ steps.pr_keystore.outputs.cache-primary-key }}

      # Only the 3 modules that actually have a src/test source set. Targeting them
      # explicitly (rather than the broader `test` lifecycle task) skips building
      # unit-test variants for modules that have none, and skips the foss/izzy
      # variants of :app since these tests don't vary by flavor.
      - name: Run Unit Tests
        run: >-
          ./gradlew --console=plain --warning-mode summary
          testGmsDebugUnitTest
          :innertube:testDebugUnitTest
          :betterlyrics:testDebugUnitTest

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-pr-${{ github.event.number || 'manual' }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 7

      - name: Build GMS Debug APK
        run: ./gradlew --console=plain assembleGmsDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.metrolist.music.pr.p${{ github.event.number || 'manual' }}
          METROLIST_APP_NAME: Metrolist PR ${{ github.event.number || 'manual' }}
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-debug-pr-${{ github.event.number || 'manual' }}
          path: app/build/outputs/apk/gms/debug/*.apk
